services:
  mongodb:
    image: mongo:7.0
    container_name: smart-cloud-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: smart_cloud_storage
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-cloud-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/smart_cloud_storage
      - JWT_SECRET=production_jwt_secret_antigravity_2026
      - STORAGE_BACKEND=local
      - STORAGE_LOCAL_ROOT=/app/storage_vault
      - CORS_ORIGINS=http://localhost:8080,http://localhost:5173,http://127.0.0.1:8080
    volumes:
      - backend_vault:/app/storage_vault
    depends_on:
      - mongodb

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: smart-cloud-frontend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_vault:
